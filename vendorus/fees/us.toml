# Amazon US fee tables, copied by hand from Amazon's own pages.
#
# Every number here comes from the sources below. Nothing is estimated.
# When Amazon publishes new fees, add a new period and update `retrieved`.
#
# Scope: non-apparel, non-dangerous-goods items (the most common private-label
# case). Apparel and dangerous goods have their own Amazon rate cards and are
# flagged as "not supported yet" by the profit engine rather than guessed.

marketplace = "US"
retrieved = 2026-11-21
# Set to true once a person has compared these tables with Amazon's pages.
reviewed = false

[sources]
fulfillment = "https://sellercentral.amazon.com/help/hub/reference/external/GABBX6GZPA8MSZGW"
size_tiers = "https://sellercentral.amazon.com/help/hub/reference/external/GG5KW835AHDJCH8W"
fee_changes_2027 = "https://sellercentral.amazon.com/help/hub/reference/external/G201411300"
low_price = "https://sellercentral.amazon.com/help/hub/reference/external/GJTAVU7P2W2VE8Q9"
storage = "https://sellercentral.amazon.com/help/hub/reference/external/GVZX6EAEL2KZ3SGA"
referral = "https://sell.amazon.com/pricing"

# Fuel and logistics-related surcharge on fulfillment fees, applied since
# April 17, 2026. Amazon says it applies to 2027 fees too and is under review.
[surcharge]
percent = 3.5
starts = 2026-04-17

# Dimensional weight = length x width x height / divisor.
# Bulky and oversize items use a minimum width and height of 2 inches.
[dimensional_weight]
divisor = 139
bulky_min_side_in = 2

# Monthly storage per cubic foot for inventory aged 0-180 days. Same rates
# before and after the February 1, 2027 unified storage fee change. Peak is
# October-December. Older inventory costs much more (not modelled).
[storage]
standard_off_peak = 0.78
standard_peak = 2.40
oversize_off_peak = 0.56
oversize_peak = 1.40

# ---------------------------------------------------------------------------
# Size tiers. Shipping weight for tiering is the greater of unit weight and
# dimensional weight. A product gets the first tier whose limits it fits.
# Limits: max_lb, longest / median / shortest side (in), length_girth (in).
# A tier with no limits catches everything left.

[tier_sets.2026]
tiers = [
  { name = "small_standard", max_lb = 1, longest = 15, median = 12, shortest = 0.75 },
  { name = "large_standard", max_lb = 20, longest = 18, median = 14, shortest = 8 },
  { name = "small_bulky", max_lb = 50, longest = 37, median = 28, shortest = 20, length_girth = 130 },
  { name = "large_bulky", max_lb = 50, longest = 59, median = 33, shortest = 33, length_girth = 130 },
  { name = "extra_large_0_50", max_lb = 50 },
  { name = "extra_large_50_70", max_lb = 70 },
  { name = "extra_large_70_150", max_lb = 150 },
  { name = "extra_large_150_plus" },
]

[tier_sets.2027]
tiers = [
  { name = "small_standard", max_lb = 1, longest = 15, median = 12, shortest = 0.75 },
  { name = "large_standard", max_lb = 20, longest = 18, median = 14, shortest = 8 },
  { name = "small_bulky", max_lb = 50, longest = 28, median = 24, shortest = 20, length_girth = 130 },
  { name = "medium_bulky", max_lb = 50, longest = 37, median = 28, shortest = 20, length_girth = 130 },
  { name = "large_bulky", max_lb = 50, longest = 52, median = 28, shortest = 28, length_girth = 130 },
  { name = "extra_large_bulky", max_lb = 50, longest = 59, median = 33, shortest = 33, length_girth = 130 },
  { name = "small_oversize", max_lb = 50, longest = 72, length_girth = 130 },
  { name = "medium_oversize", max_lb = 70, longest = 78, length_girth = 130 },
  { name = "large_oversize", max_lb = 150, longest = 96, length_girth = 130 },
  { name = "long_oversize", max_lb = 150, longest = 108, length_girth = 165 },
  { name = "special_oversize_light", max_lb = 150 },
  { name = "special_oversize_heavy" },
]

